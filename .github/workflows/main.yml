name: Legion CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legion-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build browser client
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      # Intentionally no test command: the project release policy is build-only.
      - name: Build production client
        run: npm run build

      - name: Upload browser artifact
        uses: actions/upload-artifact@v4
        with:
          name: legion-dist
          path: dist/Legion
          if-no-files-found: error
          retention-days: 14
