<div class="w-full h-full relative" (click)="unlockAudio()">

  @if (audioBlocked()) {
    <div
      class="audio-hint fixed z-50 bottom-4 right-4 px-4 py-2 rounded-md text-sm shadow-lg"
    >
      Vui lòng nhấn vào màn hình để cho phép bật âm thanh.
    </div>
  }
</div>
