<div class="flex answers disablePointerActions flex-col gap-10 items-center justify-center h-screen w-screen">
  @for (answer of sortedAnswers(); track answer.playerIndex) {
    <mat-card
      appearance="outlined"
      [class.answer-incorrect]="answer.correct === false && round()?.showResults === true"
      [class.answer-correct]="answer.correct === true && round()?.showResults === true"
      class="w-2/5 h-max overflow-hidden"
    >
      <mat-card-content class="flex flex-col gap-2">
        <div class="text-left text-lg font-semibold pb-2 border-b border-outline-variant">
          {{ session.match()?.players?.[answer.playerIndex]?.name }}
        </div>
        <div class="flex h-16 justify-center items-center gap-3">
          <div class="w-8/12 text-center text-2xl font-bold">
            {{ answer.answer.toUpperCase() }}
          </div>
          <div class="text-2xl font-mono">
            {{ getTimePassed(answer) }}
          </div>
        </div>
      </mat-card-content>
    </mat-card>
  }
</div>
