<div class="flex h-screen w-screen gap-5 p-10 box-border">
  <div class="disablePointerActions box-border flex flex-col items-center">
    <countdown [currentTime]="currentTime()" [maxTime]="maxTime()" />

    <div class="text-2xl w-64 rounded-xl mt-11 text-center">
      {{ currentQuestion()?.question }}
    </div>

    <player-list
      [players]="session.match()?.players ?? []"
      [highlightIndex]="session.playerIndex() ?? -1"
    ></player-list>
  </div>
  <div class="text-3xl flex flex-col gap-3">
    @if (currentQuestion()?.type === 'video') {
      <video
        muted="true"
        id="video-1"
        class="disablePointerActions questionBox z-10 w-full h-full"
        preload="auto"
        poster="../../assets/misc/placeholder.png"
      >
        <source [src]="videoUrl()" type="video/mp4" />
      </video>
    } @else if (currentQuestion()?.type === 'image' && imageUrl()) {
      <img [src]="imageUrl()" class="disablePointerActions questionBox object-cover w-full h-full" />
    } @else {
      <img
        src="../../assets/misc/placeholder.png"
        class="shadow-xl disablePointerActions questionBox w-full h-full"
      />
    }
    <div class="w-full flex gap-2 justify-center items-center">
      @if (session.role() !== Role.Viewer) {
        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-5/12">
          <input
            matInput
            autofocus
            (keyup)="clearAnswerIfExpired()"
            [ngModel]="playerAnswer()"
            (ngModelChange)="playerAnswer.set($event)"
            (keydown.enter)="submitAnswer()"
            autocomplete="off"
            placeholder="Đáp án"
          />
        </mat-form-field>
        <button (click)="submitAnswer()" [disabled]="disabledAnswerBox()" mat-icon-button>
          <mat-icon>done</mat-icon>
        </button>
        <span class="disablePointerActions w-3/12 flex-wrap text-2xl ml-5 p-2 rounded-xl inline text-center">
          {{ answerCache().toUpperCase() }}
        </span>
        <span class="disablePointerActions text-4xl flex-grow ml-5 p-2 rounded-xl inline-block text-center">
          {{ readableTime() }}
        </span>
      }
    </div>
  </div>
</div>
