<div class="admin-container" appResizeGroup>
  <mat-card appearance="outlined" class="w-full h-full">
    <mat-card-header>
      <mat-card-title>Quản lý câu hỏi</mat-card-title>
      <mat-card-subtitle>Câu hỏi phụ dùng để phân định thắng thua.</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content class="overflow-y-auto">
      @if (round(); as data) {
        <editable-table [rows]="data.questions" [columns]="questionColumns" [selected]="chosenRow()" (cellSave)="saveQuestionCell($event)" (rowClick)="onClickQuestion($event)" (rowDblClick)="onDoubleClickQuestion($event)">
          <ng-template tableCell="shown" let-row>
            @if (displayingRow() === row) { <mat-icon>visibility</mat-icon> }
          </ng-template>
        </editable-table>
      }
    </mat-card-content>
    <mat-card-actions align="end">
      <button mat-button (click)="clearQuestion()">
        <mat-icon>visibility_off</mat-icon>
        Ẩn câu hỏi
      </button>
      <button mat-button (click)="editQuestion()">
        <mat-icon>edit</mat-icon>
        Chỉnh sửa
      </button>
    </mat-card-actions>
  </mat-card>

  <mat-card appearance="outlined" class="w-full h-full">
    <mat-card-header>
      <mat-card-title>Quản lý vòng đấu</mat-card-title>
    </mat-card-header>
    <mat-card-content class="overflow-y-auto">
      <menu-item title="Thí sinh giành quyền" description="Thí sinh bấm chuông sớm nhất.">
        @if (lastTurnName()) {
          {{ lastTurnName() }}
        } @else {
          Chưa có thí sinh bấm chuông.
        }
      </menu-item>
      <menu-item title="Chấm điểm" description="Chấm đúng sai cho thí sinh đang giữ quyền trả lời.">
        <button mat-flat-button [disabled]="lastTurnIndex() === null" (click)="markCorrect()">
          <mat-icon>done</mat-icon>
          Đúng
        </button>
        <button mat-button [disabled]="lastTurnIndex() === null" (click)="markWrong()">
          <mat-icon>clear</mat-icon>
          Sai
        </button>
      </menu-item>
      <menu-item title="Âm thanh" description="Âm thanh khoảng trống.">
        <button mat-button [disabled]="currentTime() <= 0" (click)="playSfx('BLANK_SPC')">
          <mat-icon>music_note</mat-icon>
          Âm thanh khoảng trống
        </button>
      </menu-item>
      <menu-item title="Điều khiển" description="Đồng hồ hiện tại: {{ currentTime() }}s">
        <button mat-flat-button (click)="clockStart()">
          <mat-icon>play_arrow</mat-icon>
          Bắt đầu thời gian
        </button>
        <button mat-button (click)="clockPause()">
          <mat-icon>pause</mat-icon>
          Dừng / tiếp tục
        </button>
      </menu-item>

      <mat-card appearance="outlined" class="player-table-card">
        <mat-card-header>
          <mat-card-title>Thông tin thí sinh</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          @if (round(); as data) {
            <editable-table [rows]="players()" [columns]="playerColumns" (cellSave)="savePlayerCell($event)">
              <ng-template tableCell="active" let-row><mat-checkbox disabled="true" [checked]="row.isReady"></mat-checkbox></ng-template>
              <ng-template tableCell="playing" let-i="index">
                <mat-checkbox [checked]="data.playedPlayers[i] ?? false" (change)="setPlayed(i, $event.checked)"></mat-checkbox>
              </ng-template>
            </editable-table>
          }
        </mat-card-content>
      </mat-card>
    </mat-card-content>
  </mat-card>
</div>
