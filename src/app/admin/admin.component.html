<mat-toolbar>
  <button type="button" class="brand" (click)="logout()" matTooltip="Đăng xuất">
    <img class="brand-logo" [src]="assets.image('misc/logo.png')" alt="Legion" />
  </button>
  @if (positionLabel()) {
    <span class="position-badge">{{ positionLabel() }}</span>
  }

  <span class="toolbar-spacer"></span>

  <button
    mat-button
    (click)="togglePoints()"
    [matTooltip]="showingPoints() ? 'Đang chiếu bảng điểm' : 'Chiếu bảng điểm'"
  >
    <mat-icon>scoreboard</mat-icon>
    {{ showingPoints() ? 'Đang chiếu' : 'Điểm số' }}
  </button>
  <a mat-icon-button routerLink="/editor" matTooltip="Mở bộ biên tập cục bộ">
    <mat-icon>edit_note</mat-icon>
  </a>
  <a mat-icon-button routerLink="/admin/appearance" matTooltip="Cài đặt & giao diện">
    <mat-icon>settings</mat-icon>
  </a>
</mat-toolbar>

<nav mat-tab-nav-bar [tabPanel]="tabPanel" mat-stretch-tabs="false">
  @for (item of navItems; track item.route) {
    <a
      mat-tab-link
      #rla="routerLinkActive"
      [routerLink]="item.route"
      routerLinkActive
      [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
      [active]="rla.isActive"
    >
      <mat-icon>{{ item.icon }}</mat-icon>
      {{ item.label }}
    </a>
  }
</nav>

<mat-tab-nav-panel #tabPanel>
  <router-outlet></router-outlet>
</mat-tab-nav-panel>
