<h2 mat-dialog-title>Chỉnh sửa thông tin thí sinh</h2>
<div mat-dialog-content class="operator-dialog-content">
  <div class="operator-dialog-fields">
    <mat-form-field class="wide-field">
      <mat-label>Tên thí sinh</mat-label>
      <input matInput [(ngModel)]="form.name" autocomplete="off" required />
    </mat-form-field>
    <mat-form-field>
      <mat-label>Điểm hiện tại</mat-label>
      <input matInput type="number" [(ngModel)]="form.score" />
    </mat-form-field>
  </div>
</div>
<div mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Huỷ</button>
  <button mat-flat-button type="button" (click)="save()" cdkFocusInitial>Lưu thí sinh</button>
</div>
