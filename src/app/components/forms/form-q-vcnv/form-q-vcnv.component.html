<h2 mat-dialog-title>Chỉnh sửa câu hỏi Vượt chướng ngại vật</h2>
<div mat-dialog-content class="operator-dialog-content">
  <mat-radio-group class="operator-dialog-radio-group" aria-label="Loại câu hỏi" [(ngModel)]="form.type">
    <mat-radio-button value="HN">Hàng ngang</mat-radio-button>
    <mat-radio-button value="HN_S">Hàng ngang có âm thanh</mat-radio-button>
  </mat-radio-group>

  <div class="operator-dialog-fields">
    <mat-form-field class="wide-field">
      <mat-label>Câu hỏi</mat-label>
      <input matInput [(ngModel)]="form.question" autocomplete="off" required />
    </mat-form-field>
    <mat-form-field class="wide-field">
      <mat-label>Đáp án</mat-label>
      <input matInput [(ngModel)]="form.answer" autocomplete="off" required />
    </mat-form-field>
  </div>

  @if (form.type === 'HN_S') {
    <div class="operator-dialog-upload">
      <button mat-stroked-button type="button" [disabled]="uploadingAudio()" (click)="audioInput.click()">
        Tải file âm thanh
      </button>
      <input #audioInput class="file-input" type="file" accept="audio/*" (change)="onAudioSelected($event)" />
      @if (uploadingAudio()) {
        <mat-spinner diameter="20" aria-label="Đang tải file âm thanh"></mat-spinner>
      } @else if (form.audioFile) {
        <span>{{ form.audioFile }}</span>
      }
    </div>
  }
</div>
<div mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Huỷ</button>
  <button
    mat-flat-button
    type="button"
    [disabled]="uploadingAudio()"
    (click)="save()"
    cdkFocusInitial
  >
    Lưu câu hỏi
  </button>
</div>
