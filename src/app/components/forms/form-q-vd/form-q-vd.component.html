<h2 mat-dialog-title>Chỉnh sửa câu hỏi Về đích</h2>
<div mat-dialog-content class="operator-dialog-content">
  <mat-radio-group class="operator-dialog-radio-group" aria-label="Loại câu hỏi" [(ngModel)]="form.type">
    <mat-radio-button value="N">Văn bản</mat-radio-button>
    <mat-radio-button value="A">Âm thanh</mat-radio-button>
    <mat-radio-button value="V">Video</mat-radio-button>
    <mat-radio-button value="I">Hình ảnh</mat-radio-button>
  </mat-radio-group>

  <mat-radio-group class="operator-dialog-radio-group" aria-label="Giá trị câu hỏi" [(ngModel)]="form.value">
    <span>Giá trị câu hỏi</span>
    <mat-radio-button [value]="30">30 điểm</mat-radio-button>
    <mat-radio-button [value]="20">20 điểm</mat-radio-button>
  </mat-radio-group>

  <div class="operator-dialog-fields">
    <mat-form-field class="wide-field">
      <mat-label>Câu hỏi</mat-label>
      <textarea matInput rows="5" [(ngModel)]="form.question" required></textarea>
    </mat-form-field>
    <mat-form-field class="wide-field">
      <mat-label>Đáp án</mat-label>
      <textarea matInput rows="2" [(ngModel)]="form.answer" required></textarea>
    </mat-form-field>
  </div>

  @if (form.type !== 'N') {
    <div class="operator-dialog-upload">
      <button mat-stroked-button type="button" [disabled]="uploading()" (click)="mediaInput.click()">
        Tải {{ form.type === 'A' ? 'file âm thanh' : form.type === 'V' ? 'video' : 'hình ảnh' }}
      </button>
      <input
        #mediaInput
        class="file-input"
        type="file"
        [accept]="form.type === 'A' ? 'audio/*' : form.type === 'V' ? 'video/*' : 'image/*'"
        (change)="onMediaSelected($event)"
      />
      @if (uploading()) {
        <mat-spinner diameter="20" aria-label="Đang tải file"></mat-spinner>
      } @else if (form.mediaFile) {
        <span>{{ form.mediaFile }}</span>
      }
    </div>
  }
</div>
<div mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Huỷ</button>
  <button mat-flat-button type="button" [disabled]="uploading()" (click)="save()" cdkFocusInitial>
    Lưu câu hỏi
  </button>
</div>
