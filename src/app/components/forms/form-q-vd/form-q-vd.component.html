<h1 mat-dialog-title>Thêm/Sửa câu hỏi</h1>
<div mat-dialog-content>
  <div class="flex flex-col">
    <mat-radio-group
      class="flex"
      aria-label="Chọn loại câu hỏi"
      [(ngModel)]="data.type"
    >
      <mat-label>Loại câu hỏi</mat-label>
      <mat-radio-button class="p-5" value="N">Bình thường</mat-radio-button>
      <mat-radio-button class="p-5" value="A">Âm thanh</mat-radio-button>
      <mat-radio-button class="p-5" value="V">Video</mat-radio-button>
      <mat-radio-button class="p-5" value="I">Hình ảnh</mat-radio-button>
    </mat-radio-group>
    <mat-radio-group
      class="flex"
      aria-label="Chọn điểm"
      [(ngModel)]="data.value"
    >
      <mat-label>Điểm</mat-label>
      <mat-radio-button class="p-5" [value]="30">30</mat-radio-button>
      <mat-radio-button class="p-5" [value]="20">20</mat-radio-button>
    </mat-radio-group>
    <mat-form-field>
      <textarea
        class="h-52"
        matInput
        placeholder="Câu hỏi"
        [(ngModel)]="data.question"
      ></textarea>
    </mat-form-field>
    <mat-form-field>
      <textarea
        matInput
        placeholder="Đáp án"
        [(ngModel)]="data.answer"
      ></textarea>
    </mat-form-field>
    @if (data.type !== 'N') {
      <div class="flex items-center gap-2 mt-2">
        <button mat-button type="button" [disabled]="uploading()" (click)="fileInput.click()">
          Tải file Video/Âm thanh/Hình ảnh
        </button>
        <input
          #fileInput
          class="file-input"
          type="file"
          [accept]="data.type === 'A' ? 'audio/*' : data.type === 'V' ? 'video/*' : 'image/*'"
          (change)="onMediaSelected($event)"
        />
        @if (uploading()) {
          <mat-spinner diameter="20"></mat-spinner>
        } @else if (data.mediaFile) {
          <span class="text-sm opacity-70">{{ data.mediaFile }}</span>
        }
      </div>
    }
  </div>
</div>
<div mat-dialog-actions>
  <button mat-button (click)="onNoClick()">Huỷ</button>
  <button mat-button [mat-dialog-close]="data" cdkFocusInitial>OK</button>
</div>
