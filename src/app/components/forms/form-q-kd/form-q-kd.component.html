<h1 mat-dialog-title>Thêm/Sửa câu hỏi</h1>
<div mat-dialog-content>
  <div>
    <mat-radio-group aria-label="Chọn loại câu hỏi" [(ngModel)]="data.type">
      <mat-radio-button class="p-5" value="N">Bình thường</mat-radio-button>
      <mat-radio-button class="p-5" value="A">Âm thanh</mat-radio-button>
      <mat-radio-button class="p-5" value="P">Hình ảnh</mat-radio-button>
    </mat-radio-group>
    <div>
      <mat-form-field class="inputForm mt-2 inline">
        <input matInput placeholder="Câu hỏi" [(ngModel)]="data.question" />
      </mat-form-field>
      <mat-form-field class="inputForm mt-2 ml-2 inline">
        <input matInput placeholder="Đáp án" [(ngModel)]="data.answer" />
      </mat-form-field>
    </div>
    @if (data.type !== 'N') {
      <div class="mt-2 flex items-center gap-2">
        <button mat-button type="button" [disabled]="uploading()" (click)="fileInput.click()">
          Tải file {{ data.type === 'A' ? 'âm thanh' : 'hình ảnh' }}
        </button>
        <input
          #fileInput
          class="file-input"
          type="file"
          [accept]="data.type === 'A' ? 'audio/*' : 'image/*'"
          (change)="onMediaSelected($event)"
        />
        @if (uploading()) {
          <mat-spinner diameter="20"></mat-spinner>
        } @else if (data.mediaFile) {
          <span class="text-sm opacity-70">{{ data.mediaFile }}</span>
        }
      </div>
    }
  </div>
  <div mat-dialog-actions>
    <button mat-button (click)="onNoClick()">Huỷ</button>
    <button mat-button [mat-dialog-close]="data" cdkFocusInitial>OK</button>
  </div>
</div>
