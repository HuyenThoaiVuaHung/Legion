<h2 mat-dialog-title>Chỉnh sửa câu hỏi phụ</h2>
<div mat-dialog-content class="operator-dialog-content">
  <div class="operator-dialog-fields">
    <mat-form-field class="wide-field">
      <mat-label>Câu hỏi</mat-label>
      <input matInput [(ngModel)]="form.question" autocomplete="off" required />
    </mat-form-field>
    <mat-form-field class="wide-field">
      <mat-label>Đáp án</mat-label>
      <input matInput [(ngModel)]="form.answer" autocomplete="off" required />
    </mat-form-field>
  </div>
</div>
<div mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Huỷ</button>
  <button mat-flat-button type="button" (click)="save()" cdkFocusInitial>Lưu câu hỏi</button>
</div>
