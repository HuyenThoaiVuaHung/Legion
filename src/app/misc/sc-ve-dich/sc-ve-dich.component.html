@if (round(); as round) {
  <div class="base relative gap-10 flex w-screen justify-center items-center">
    <div class="question rounded-md overflow-hidden w-[70rem] flex flex-col">
      <div class="h-12 w-full flex">
        @for (player of players(); track player.id; let i = $index) {
          <div
            [ngClass]="{
              'name-highlight': round.activePlayerIndex === i,
              'special-highlight': stealingPlayerIndex() === i,
            }"
            class="border-2 border-white w-full box-border h-full bg-surface font-semibold flex justify-between gap-2 items-center p-5"
          >
            <span>{{ player.name.toUpperCase() }}</span>
            <span>{{ player.score }}</span>
          </div>
        }
      </div>
      <div class="w-full relative text-xl bg-surface-container box-border p-5 h-56 rounded-b-md">
        {{ currentQuestion()?.question }}
        @if (round.hopeStarActive) {
          <span class="absolute right-0 bottom-0 text-5xl text-primary p-5">★</span>
        }
      </div>
    </div>
    <div
      class="w-52 text-7xl border-2 font-semibold bg-surface-container rounded-xl grid place-items-center h-52"
    >
      {{ clockSeconds() }}
    </div>
  </div>
}
